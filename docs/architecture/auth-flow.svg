<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" role="img" aria-labelledby="t d" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif">
  <title id="t">CloudOps Auto 인증 흐름: 웹 로그인과 AWS 연결은 서로 다른 두 단계</title>
  <desc id="d">1단계 웹 로그인으로 앱 사용자를 확인하고, 2단계 AWS Device Code 연결로 사용자 전용 worker가 허용된 계정과 역할의 임시 자격증명을 얻어 읽기 전용 조회를 한다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <style>
      .t{fill:#0f172a}.s{fill:#475569}.h{font-weight:700}
      .card{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
      .web{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
      .aws{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.5}
      .ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.5}
      .warn{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
      .line{stroke:#475569;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1100" height="820" fill="#f8fafc"/>
  <text x="40" y="44" font-size="24" class="t h">로그인은 두 번, 서로 다른 질문에 답합니다</text>
  <text x="40" y="70" font-size="14" class="s">웹 로그인 ≠ AWS 접근. 웹 로그인이 성공해도 AWS 권한은 생기지 않고, Device Code 토큰도 웹 신원으로 쓰지 않습니다.</text>

  <!-- Panel 1 -->
  <rect x="30" y="90" width="1040" height="165" rx="12" class="web" opacity="0.55"/>
  <text x="50" y="120" font-size="17" class="t h">① 웹 로그인 — “누가 이 앱을 쓰는가?”</text>
  <g font-size="14">
    <rect x="50" y="140" width="210" height="80" rx="8" class="card"/><text x="155" y="173" text-anchor="middle" class="t h">사용자 브라우저</text><text x="155" y="196" text-anchor="middle" class="s">로그인 팝업 열기</text>
    <rect x="320" y="140" width="210" height="80" rx="8" class="card"/><text x="425" y="173" text-anchor="middle" class="t h">회사 로그인</text><text x="425" y="196" text-anchor="middle" class="s">SAML / OIDC (현재 SAML)</text>
    <rect x="590" y="140" width="210" height="80" rx="8" class="card"/><text x="695" y="173" text-anchor="middle" class="t h">서버 (host)</text><text x="695" y="196" text-anchor="middle" class="s">서명 검증 · 멤버십 확인</text>
    <rect x="860" y="140" width="190" height="80" rx="8" class="ok"/><text x="955" y="173" text-anchor="middle" class="t h">앱 세션</text><text x="955" y="196" text-anchor="middle" class="s">조직·업무공간·역할</text>
  </g>
  <path d="M260 180 H318" class="line" marker-end="url(#arr)"/><path d="M530 180 H588" class="line" marker-end="url(#arr)"/><path d="M800 180 H858" class="line" marker-end="url(#arr)"/>
  <text x="290" y="168" font-size="12" text-anchor="middle" class="s">이동</text>
  <text x="559" y="168" font-size="12" text-anchor="middle" class="s">결과</text>
  <text x="829" y="168" font-size="12" text-anchor="middle" class="s">확정</text>
  <text x="50" y="244" font-size="13" class="s">결과: 앱 세션만 생깁니다. AWS 계정·역할 권한은 아직 없습니다.</text>

  <!-- Panel 2 -->
  <rect x="30" y="275" width="1040" height="330" rx="12" class="aws" opacity="0.45"/>
  <text x="50" y="305" font-size="17" class="t h">② AWS 연결 — “이 사람이 어떤 계정·역할을 쓸 수 있는가?” (Payer마다 따로)</text>

  <g font-size="13">
    <!-- row 1 -->
    <rect x="50" y="325" width="235" height="118" rx="8" class="card"/>
    <circle cx="72" cy="347" r="12" fill="#f59e0b"/><text x="72" y="352" text-anchor="middle" fill="#fff" class="h">1</text>
    <text x="92" y="352" class="t h">Payer 선택</text><text x="62" y="378" class="s">서버가 허용한 Payer만 보입니다.</text><text x="62" y="398" class="s">계정·역할·리전은 서버 설정이</text><text x="62" y="418" class="s">고정하고 화면은 고르기만 합니다.</text>

    <rect x="315" y="325" width="235" height="118" rx="8" class="card"/>
    <circle cx="337" cy="347" r="12" fill="#f59e0b"/><text x="337" y="352" text-anchor="middle" fill="#fff" class="h">2</text>
    <text x="357" y="352" class="t h">전용 worker 시작</text><text x="327" y="378" class="s">사용자마다 Docker 컨테이너와</text><text x="327" y="398" class="s">전용 홈·캐시(0700)를 만듭니다.</text><text x="327" y="418" class="s">다른 사람과 로그인 상태가 섞이지 않음</text>

    <rect x="580" y="325" width="235" height="118" rx="8" class="card"/>
    <circle cx="602" cy="347" r="12" fill="#f59e0b"/><text x="602" y="352" text-anchor="middle" fill="#fff" class="h">3</text>
    <text x="622" y="352" class="t h">Device Code 요청</text><text x="592" y="378" class="s">worker가 AWS CLI를 실행합니다.</text><text x="592" y="398" class="s" font-family="ui-monospace,Menlo,monospace" font-size="11">aws sso login --use-device-code</text><text x="592" y="418" class="s" font-family="ui-monospace,Menlo,monospace" font-size="11">--no-browser</text>

    <rect x="845" y="325" width="205" height="118" rx="8" class="card"/>
    <circle cx="867" cy="347" r="12" fill="#f59e0b"/><text x="867" y="352" text-anchor="middle" fill="#fff" class="h">4</text>
    <text x="887" y="352" class="t h">코드 표시</text><text x="857" y="378" class="s">화면에 사용자 코드와</text><text x="857" y="398" class="s">AWS 인증 링크를 보여 주고</text><text x="857" y="418" class="s">같은 클릭으로 창을 엽니다.</text>

    <!-- row 2 -->
    <rect x="50" y="470" width="235" height="118" rx="8" class="card"/>
    <circle cx="72" cy="492" r="12" fill="#f59e0b"/><text x="72" y="497" text-anchor="middle" fill="#fff" class="h">5</text>
    <text x="92" y="497" class="t h">AWS에서 승인</text><text x="62" y="523" class="s">사용자가 AWS 페이지에서</text><text x="62" y="543" class="s">로그인·MFA·허용을 누릅니다.</text><text x="62" y="563" class="s">비밀번호는 AWS 화면에만 입력</text>

    <rect x="315" y="470" width="235" height="118" rx="8" class="card"/>
    <circle cx="337" cy="492" r="12" fill="#f59e0b"/><text x="337" y="497" text-anchor="middle" fill="#fff" class="h">6</text>
    <text x="357" y="497" class="t h">토큰 받기</text><text x="327" y="523" class="s">worker의 CLI가 승인 완료를</text><text x="327" y="543" class="s">확인해 SSO 토큰을 전용 캐시에</text><text x="327" y="563" class="s">저장합니다. 포트 공개 없음.</text>

    <rect x="580" y="470" width="235" height="118" rx="8" class="card"/>
    <circle cx="602" cy="492" r="12" fill="#f59e0b"/><text x="602" y="497" text-anchor="middle" fill="#fff" class="h">7</text>
    <text x="622" y="497" class="t h">신원 확인 (STS)</text><text x="592" y="523" class="s">get-caller-identity 결과가 서버가</text><text x="592" y="543" class="s">고정한 계정·AWSReservedSSO 역할과</text><text x="592" y="563" class="s">같을 때만 연결로 인정합니다.</text>

    <rect x="845" y="470" width="205" height="118" rx="8" class="ok"/>
    <circle cx="867" cy="492" r="12" fill="#22c55e"/><text x="867" y="497" text-anchor="middle" fill="#fff" class="h">8</text>
    <text x="887" y="497" class="t h">조회·런북</text><text x="857" y="523" class="s">고정된 읽기 API만 호출.</text><text x="857" y="543" class="s">쓰기는 승인된 런북만,</text><text x="857" y="563" class="s">전후 신원을 다시 확인.</text>
  </g>
  <path d="M285 384 H313" class="line" marker-end="url(#arr)"/><path d="M550 384 H578" class="line" marker-end="url(#arr)"/><path d="M815 384 H843" class="line" marker-end="url(#arr)"/>
  <path d="M947 443 V457 H167 V468" class="line" marker-end="url(#arr)"/>
  <path d="M285 529 H313" class="line" marker-end="url(#arr)"/><path d="M550 529 H578" class="line" marker-end="url(#arr)"/><path d="M815 529 H843" class="line" marker-end="url(#arr)"/>

  <!-- Bottom -->
  <g font-size="13">
    <rect x="30" y="625" width="505" height="88" rx="10" class="ok"/>
    <text x="50" y="651" font-size="15" class="t h">서버가 요청마다 다시 확인합니다</text>
    <text x="50" y="674" class="s">현재 웹 세션 · 조직/업무공간 멤버십 · 역할 · 연결 소유자 ·</text>
    <text x="50" y="694" class="s">worker 세대. OU/Payer를 골랐거나 로그인에 성공했다는 이유로 권한을 주지 않습니다.</text>

    <rect x="565" y="625" width="505" height="88" rx="10" class="card"/>
    <text x="585" y="651" font-size="15" class="t h">화면(클라이언트)이 정하지 못하는 것</text>
    <text x="585" y="674" class="s">계정 ID · 역할 · 프로필 · 엔드포인트 · 실행 명령.</text>
    <text x="585" y="694" class="s">전부 서버 설정과 고정 카탈로그에서만 옵니다.</text>

    <rect x="30" y="728" width="1040" height="72" rx="10" class="warn"/>
    <text x="50" y="754" font-size="15" class="t h">아직 없는 검사 (공유 서비스 전 검증 필요)</text>
    <text x="50" y="777" class="s">웹에 로그인한 사람과 Device Code를 승인한 사람이 같은 사람인지는 최초 연결 때 대조하지 않습니다.</text>
    <text x="50" y="795" class="s">연결 뒤에는 최초에 확인한 AWS 신원이 바뀌면 세션을 끝냅니다. 최초 연결의 동일인 검사는 별도 설계 과제입니다.</text>
  </g>
</svg>
